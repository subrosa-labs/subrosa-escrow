[workspace]
resolver = "2"
members = ["subrosa_escrow"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/subrosa-escrow/subrosa-escrow"
authors = ["SubRosa Core <security@subrosa.example>"]

[workspace.dependencies]
soroban-sdk = "22.0.6"
soroban-sdk-testutils = "22.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
