[package]
name = "subrosa_escrow"
description = "SubRosa Escrow: sealed-bid escrow and auction engine for Stellar Soroban"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Used only to produce real ed25519 relayer signatures in the attestation tests;
# `soroban_sdk::testutils::ed25519::Signer` is implemented for `SigningKey`.
ed25519-dalek = "2.1.3"

[features]
default = []
testutils = ["soroban-sdk/testutils"]
