name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal by default: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint, test, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Relayer tests
        run: npm test --workspace backend

      - name: Browser encoder tests
        run: npm run test --workspace frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Build the frontend
        run: npm run build --workspace frontend

  contracts:
    name: Contract (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.81.0 plus the wasm32 target, so rustup installs
      # exactly what a local `make -C contracts` build uses.
      - name: Install pinned Rust toolchain
        run: rustup show && rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --features testutils -- -D warnings

      - name: Tests
        run: cargo test --features testutils

  audit:
    name: Dependency audit (non-blocking)
    runs-on: ubuntu-latest
    # Advisory only: an upstream CVE with no non-breaking fix must not block a
    # correct change. Triage from the job summary and open a Dependabot PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: npm audit (production dependencies)
        run: npm audit --omit=dev
